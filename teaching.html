<!DOCTYPE html>

<head>

  <title>Elena Boni — Teaching</title>
  <link rel="icon" href="poppy.png" type="image/png">
  <style>
    :root { --accent: #5b6f52; --text: #5b6f52; --muted: #7c8f74; }
    body { margin:0; font-family: system-ui, sans-serif; color:var(--text); background:#fff; line-height:1.6; }
    header { padding:12px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; }
    nav a { margin-left:16px; text-decoration:none; color:var(--text); }
    nav a:hover { color: var(--accent); text-decoration:underline; }
    .container { max-width:960px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 8px; color: var(--accent); }
    strong { color: var(--accent); }
    .teaching-entry { display:flex; gap:16px; margin:16px 0; }
    .teaching-entry .dates { flex:0 0 140px; color: var(--accent); font-weight: 600; }
    .teaching-entry .desc { flex:1; }
    p { text-align: justify; text-justify: inter-word; margin-bottom: 0; }
    footer { margin-top:40px; }
    .foot { max-width:960px; margin:0 auto; padding:16px 24px; font-size:14px; display:flex; justify-content:space-between; color:var(--muted); }
    .no-style-link {
      text-decoration: none;
      color: inherit;
    }
    .no-style-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div><a href="index.html" class="no-style-link"><strong>Elena Boni</strong></a></div>

  </script>
